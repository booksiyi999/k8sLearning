<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s 实战学堂</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Alpine.js: 响应式框架（本地化，不依赖外网 CDN） -->
  <script src="vendor/alpine.min.js" defer></script>
  <!-- marked.js: Markdown 渲染（本地化） -->
  <script src="vendor/marked.min.js"></script>
  <!-- canvas-confetti: 庆祝纸屑特效（本地化） -->
  <script src="vendor/confetti.browser.min.js"></script>
  <!-- terminal.js: 交互式终端组件（终端 mixin） -->
  <script src="terminal.js"></script>
</head>
<body>
<!-- ============ Alpine 根组件 ============ -->
<div x-data="quest()" x-init="init()">

  <!-- ==================== 顶栏 ==================== -->
  <header class="topbar">
    <div class="logo" @click="resetAll()">
      <span class="logo-icon">🚀</span>
      <span class="logo-text">K8s 实战学堂</span>
    </div>

    <!-- XP 进度条 -->
    <div class="xp-bar-container">
      <div class="xp-info">
        <span class="xp-value" x-text="progress.total_xp + ' XP'"></span>
        <span class="rank-name" x-text="currentRank" :class="{ 'rank-up': rankUpAnim }"></span>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" :style="`width: ${xpPercent}%`"></div>
        <span class="xp-bar-label" x-text="xpBarLabel"></span>
      </div>
    </div>

    <!-- 连击计数器 -->
    <div class="streak-counter" :class="{ 'streak-fire': progress.streak >= 3 }">
      <span class="streak-icon" x-text="progress.streak >= 3 ? '🔥' : '⚡'"></span>
      <span class="streak-value" x-text="'x' + progress.streak"></span>
      <span class="streak-label">连击</span>
      <template x-if="progress.max_streak > 0">
        <span class="streak-max" x-text="'最高 x' + progress.max_streak"></span>
      </template>
    </div>

    <!-- 终端入口 -->
    <a href="/terminal.html" class="terminal-entry-link" title="打开独立终端页面">🖥️ 终端</a>
  </header>

  <!-- ==================== 主区域: 三栏布局 ==================== -->
  <main class="main-grid">

    <!-- ========== 左栏: 章节导航 ========== -->
    <aside class="sidebar-left">
      <h3 class="sidebar-title">📚 章节导航</h3>
      <template x-for="(ch, chId) in chapters" :key="chId">
        <div class="chapter-card"
             :class="{ unlocked: isChapterUnlocked(chId), locked: !isChapterUnlocked(chId) }"
             :style="`--ch-color: ${ch.color}`">

          <!-- 章节头部 -->
          <div class="chapter-header" @click="isChapterUnlocked(chId) && toggleChapter(chId)">
            <span class="chapter-icon" x-text="ch.icon"></span>
            <div class="chapter-info">
              <div class="chapter-title-row">
                <span class="chapter-title" x-text="ch.title"></span>
                <span class="track-badge" :class="trackClass(ch.track)"
                      x-text="trackIcon(ch.track) + ' ' + (ch.track || '基础级')"></span>
              </div>
              <span class="chapter-desc" x-text="ch.description"></span>
            </div>
            <span class="chapter-count" x-text="chapterProgress(chId)"></span>
          </div>

          <!-- 章节进度条 -->
          <div class="chapter-progress-bar">
            <div class="chapter-progress-fill"
                 :style="`width: ${chapterProgressPercent(chId)}%; background: ${ch.color}`"></div>
          </div>

          <!-- 关卡圆点列表 -->
          <div class="level-dots" x-show="expandedChapter === chId || !isChapterUnlocked(chId)">
            <template x-for="lv in chapterLevels(chId)" :key="lv.id">
              <div class="level-dot-row"
                   :class="{ completed: isCompleted(lv.id), locked: !isChapterUnlocked(chId) }"
                   @click="isChapterUnlocked(chId) && loadLevel(lv.id)">
                <span class="level-dot"
                      x-text="isCompleted(lv.id) ? '✓' : (!isChapterUnlocked(chId) ? '🔒' : '·')"
                      :class="{ 'dot-done': isCompleted(lv.id), 'dot-locked': !isChapterUnlocked(chId) }"></span>
                <span class="level-dot-title" x-text="lv.id + ' ' + lv.title"></span>
              </div>
            </template>
            <template x-if="!isChapterUnlocked(chId)">
              <p class="locked-hint">🔒 完成上一章节解锁</p>
            </template>
          </div>
        </div>
      </template>
    </aside>

    <!-- ========== 中栏: 关卡详情 ========== -->
    <section class="content-center">
      <template x-if="currentLevel">
        <article class="level-detail">
          <!-- 关卡标题 -->
          <div class="level-header">
            <h2>
              <span class="level-id-badge" x-text="currentLevel.id"></span>
              <span x-text="currentLevel.title"></span>
              <!-- 双轨制: 赛道标签 -->
              <span class="track-badge level-track-badge"
                    :class="trackClass(chapters[currentLevel.chapter]?.track)"
                    x-text="trackIcon(chapters[currentLevel.chapter]?.track) + ' ' + (chapters[currentLevel.chapter]?.track || '基础级')"></span>
            </h2>
            <span class="level-xp-badge" x-text="'+' + currentLevel.xp + ' XP'"></span>
          </div>

          <!-- Markdown 描述 -->
          <div class="level-description" x-html="renderedDescription"></div>

          <!-- 知识点标签 -->
          <div class="knowledge-tags">
            <template x-for="kp in (currentLevel.knowledge_points || [])" :key="kp">
              <span class="kp-tag" x-text="'🏷️ ' + kp"></span>
            </template>
          </div>

          <!-- Tab 导航 -->
          <div class="tab-nav">
            <button class="tab-btn" :class="{active: activeTab==='lesson'}" @click="switchTab('lesson')">📖 知识讲解</button>
            <button class="tab-btn" :class="{active: activeTab==='practice'}" @click="switchTab('practice')">✏️ 动手练习</button>
            <button class="tab-btn" :class="{active: activeTab==='terminal'}" @click="switchTab('terminal')">🖥️ 终端</button>
            <button class="tab-btn" :class="{active: activeTab==='cluster'}" @click="switchTab('cluster')" x-show="clusterMode">🔧 集群实战</button>
          </div>

          <!-- ====== Tab 1: 知识讲解面板 ====== -->
          <div class="lesson-panel" x-show="activeTab==='lesson'">
            <!-- 加载中 -->
            <template x-if="lessonLoading">
              <div class="lesson-loading">
                <div class="loading-spinner"></div>
                <p>🍒 加载教学文档中...</p>
              </div>
            </template>

            <!-- 有教学文档 -->
            <template x-if="!lessonLoading && lesson && lesson.has_lesson">
              <div class="lesson-content">
                <!-- 概念讲解 -->
                <template x-if="lesson.concept">
                  <div class="lesson-concept" x-html="renderMarkdown(lesson.concept)"></div>
                </template>

                <!-- 关键字段表格 -->
                <template x-if="lesson.key_fields && lesson.key_fields.length > 0">
                  <div class="lesson-fields-section">
                    <h4>📋 关键字段</h4>
                    <table class="lesson-fields-table">
                      <thead>
                        <tr>
                          <th>字段</th>
                          <th>说明</th>
                          <th>示例</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="f in lesson.key_fields" :key="f.field">
                          <tr>
                            <td class="field-name" x-text="f.field"></td>
                            <td x-text="f.description"></td>
                            <td class="field-example" x-text="f.example"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <!-- ASCII 图解 -->
                <template x-if="lesson.diagram">
                  <div class="lesson-diagram-section">
                    <h4>📊 图解</h4>
                    <pre class="lesson-diagram" x-text="lesson.diagram"></pre>
                  </div>
                </template>

                <!-- 示例 YAML -->
                <template x-if="lesson.example_yaml">
                  <div class="lesson-yaml-section">
                    <h4>📝 示例 YAML</h4>
                    <pre class="lesson-example-yaml" x-text="lesson.example_yaml"></pre>
                  </div>
                </template>

                <!-- 常见错误 -->
                <template x-if="lesson.common_errors && lesson.common_errors.length > 0">
                  <div class="lesson-errors">
                    <h4>⚠️ 常见错误</h4>
                    <ul>
                      <template x-for="err in lesson.common_errors" :key="err">
                        <li x-text="err"></li>
                      </template>
                    </ul>
                  </div>
                </template>

                <!-- 学习建议 -->
                <template x-if="lesson.tips && lesson.tips.length > 0">
                  <div class="lesson-tips">
                    <h4>💡 学习建议</h4>
                    <ul>
                      <template x-for="tip in lesson.tips" :key="tip">
                        <li x-text="tip"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </template>

            <!-- 没有教学文档 -->
            <template x-if="!lessonLoading && (!lesson || !lesson.has_lesson)">
              <div class="lesson-empty">
                <span class="lesson-empty-icon">📭</span>
                <p>暂无教学文档</p>
              </div>
            </template>
          </div>

          <!-- ====== Tab 2: 动手练习面板 ====== -->
          <div class="practice-panel" x-show="activeTab==='practice'">
            <!-- YAML 编辑器 (带行号风格) -->
            <div class="yaml-editor-wrap">
              <div class="yaml-editor-header">
                <span class="yaml-tab">📄 deployment.yaml</span>
                <span class="yaml-hint">Tab 键插入两个空格</span>
              </div>
              <div class="yaml-editor-body">
                <div class="line-numbers" x-html="lineNumbers"></div>
                <textarea
                  x-model="userYaml"
                  @input="updateLineNumbers()"
                  @keydown.tab.prevent="insertTab($event)"
                  class="yaml-textarea"
                  spellcheck="false"
                  rows="16"
                  placeholder="在此输入你的 YAML..."></textarea>
              </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
              <button class="btn-run" @click="runCheck()" :disabled="running">
                <span x-text="checkButtonLabel"></span>
              </button>
              <button class="btn-deploy-cluster" @click="deployToCluster()" :disabled="running" x-show="clusterMode && !isCh28">
                <span x-text="running ? '⏳ 部署中...' : '▶ 部署到集群'"></span>
              </button>
              <button class="btn-reset" @click="resetYaml()">🔄 重置</button>
              <button class="btn-hint" @click="showHint()" x-show="!hintShown">💡 提示</button>
              <button class="btn-hint" @click="hintShown = false" x-show="hintShown">🙈 收起提示</button>
            </div>

            <!-- 提示区 -->
            <template x-if="hintShown && hints.length > 0">
              <div class="hint-box">
                <strong>💡 樱桃的提示：</strong>
                <ul>
                  <template x-for="hint in hints" :key="hint">
                    <li x-text="hint"></li>
                  </template>
                </ul>
              </div>
            </template>

            <!-- 结果展示区 -->
            <template x-if="result">
              <div class="result-area" :class="{ 'result-ok': result.ok, 'result-fail': !result.ok }">
                <div class="result-header">
                  <span class="result-icon" x-text="result.ok ? '✅' : '❌'"></span>
                  <span class="result-title" x-text="result.ok ? '通过！干得漂亮喵～' : '未通过，再试试'"></span>
                </div>
                <template x-if="result.error">
                  <div class="result-error">
                    <strong>错误信息：</strong>
                    <pre x-text="result.error"></pre>
                  </div>
                </template>
                <template x-if="result.hints && result.hints.length > 0">
                  <div class="result-hints">
                    <strong>提示：</strong>
                    <ul>
                      <template x-for="hint in result.hints" :key="hint">
                        <li x-text="hint"></li>
                      </template>
                    </ul>
                  </div>
                </template>
                <!-- 集群状态 JSON -->
                <template x-if="result.cluster_state">
                  <div class="cluster-state">
                    <strong>📦 集群状态：</strong>
                    <pre x-text="JSON.stringify(result.cluster_state, null, 2)"></pre>
                  </div>
                </template>
                <!-- Ch28 集群验证详细结果 -->
                <template x-if="clusterVerifyResult && clusterVerifyResult.exec_results">
                  <div class="cluster-verify-results">
                    <strong>🔍 集群验证详情 (<span x-text="clusterVerifyResult.verification"></span>)</strong>
                    <div class="exec-results-list">
                      <template x-for="(er, idx) in clusterVerifyResult.exec_results" :key="idx">
                        <div class="exec-result-item" :class="{ 'exec-ok': er.success, 'exec-fail': !er.success }">
                          <div class="exec-cmd">
                            <span x-text="er.success ? '✅' : '❌'"></span>
                            <code x-text="'$ ' + er.command"></code>
                          </div>
                          <template x-if="er.output">
                            <pre class="exec-output" x-text="er.output"></pre>
                          </template>
                          <template x-if="er.error">
                            <pre class="exec-error" x-text="er.error"></pre>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- ====== Tab 3: 终端面板 ====== -->
          <div class="terminal-panel" x-show="activeTab==='terminal'">
            <!-- 模拟器模式提示 -->
            <template x-if="!clusterMode">
              <div class="terminal-mode-warning">
                <div class="warning-icon">🟡</div>
                <h3>当前为模拟器模式</h3>
                <p>如需使用终端请配置 <code>K8S_QUEST_MODE=cluster</code></p>
                <p class="warning-sub">配置后重启服务，即可在此关卡内直接执行 kubectl 命令。</p>
              </div>
            </template>

            <!-- 集群模式: 完整终端 -->
            <template x-if="clusterMode">
              <div class="terminal-container terminal-embedded">

                <!-- 终端顶栏 -->
                <div class="terminal-mini-bar">
                  <span class="terminal-status-badge" x-text="termStatusText"></span>
                  <button class="terminal-btn-clear" @click="termClear()">🧹 清屏</button>
                </div>

                <!-- 输出区域 -->
                <div class="term-output-area" id="term-output-embedded" @click="termFocusInput()">
                  <template x-for="(line, i) in termOutput" :key="i">
                    <div class="term-line" :class="'term-line-' + line.type">
                      <template x-if="line.type === 'cmd'">
                        <span class="term-prompt">kubectl❯&nbsp;</span>
                      </template>
                      <span class="term-text" x-text="line.text"></span>
                    </div>
                  </template>

                  <!-- 加载中指示器 -->
                  <template x-if="termLoading">
                    <div class="term-loading-line">
                      <span class="term-loading-dot"></span>
                      <span class="term-loading-text">执行中...</span>
                    </div>
                  </template>
                </div>

                <!-- 自动补全建议 -->
                <template x-if="termShowSuggest && termSuggestions.length > 0 && !termLoading">
                  <div class="term-suggest-dropdown">
                    <template x-for="(s, i) in termSuggestions" :key="s">
                      <div class="term-suggest-item"
                           :class="{ 'term-suggest-active': i === 0 }"
                           @click="termPickSuggestion(s)"
                           x-text="s"></div>
                    </template>
                  </div>
                </template>

                <!-- 确认执行区 -->
                <template x-if="termConfirmCmd">
                  <div class="term-confirm-bar">
                    <span class="term-confirm-text">
                      ⚠️ 确认执行: <code x-text="termConfirmCmd"></code>
                    </span>
                    <button class="term-btn-confirm" @click="termConfirmRun()" :disabled="termLoading">
                      ✅ 确认执行
                    </button>
                    <button class="term-btn-cancel" @click="termCancelConfirm()">✕ 取消</button>
                  </div>
                </template>

                <!-- 输入行 -->
                <div class="term-input-line">
                  <span class="term-prompt">kubectl❯</span>
                  <input type="text"
                         x-model="termInput"
                         @keydown="termOnKeydown($event)"
                         @input="termShowSuggest = true"
                         @focus="termShowSuggest = true"
                         class="term-input-field"
                         :disabled="termLoading"
                         placeholder="输入 kubectl 命令... (↑↓ 历史 · Tab 补全)"
                         spellcheck="false"
                         autocomplete="off"
                         autocapitalize="off" />
                </div>

              </div>
            </template>
          </div>

          <!-- ====== Tab 4: 集群实战面板 ====== -->
          <div class="cluster-panel" x-show="activeTab==='cluster' && clusterMode">
            <!-- 资源列表 -->
            <div class="cluster-section">
              <div class="cluster-section-header">
                <h4>📦 集群资源</h4>
                <button class="btn-refresh" @click="loadClusterResources()">🔄 刷新</button>
              </div>
              <template x-if="clusterResources.length > 0">
                <table class="resource-table">
                  <thead>
                    <tr>
                      <th>NAME</th>
                      <th>READY</th>
                      <th>STATUS</th>
                      <th>AGE</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="res in clusterResources" :key="res.name">
                      <tr>
                        <td class="res-name" x-text="res.name"></td>
                        <td x-text="res.ready || '-'"></td>
                        <td>
                          <span class="res-status" :class="{'status-running': res.status === 'Running', 'status-failed': res.status === 'Failed' || res.status === 'Error'}" x-text="res.status || '-'"></span>
                        </td>
                        <td x-text="res.age || '-'"></td>
                        <td>
                          <button class="btn-view-logs" @click="loadPodLogs(res.name)" x-show="res.kind === 'pod' || res.kind === 'Pod'">📋 日志</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
              <template x-if="clusterResources.length === 0">
                <div class="cluster-empty">
                  <p>📭 暂无资源，先去"动手练习"部署吧！</p>
                </div>
              </template>
            </div>

            <!-- Pod 日志查看器 -->
            <div class="cluster-section">
              <h4>📋 Pod 日志</h4>
              <template x-if="selectedPod">
                <div class="log-viewer-info">
                  <span>当前 Pod: <strong x-text="selectedPod"></strong></span>
                  <button class="btn-clear-logs" @click="selectedPod=''; clusterLogs=''">✕ 清除</button>
                </div>
              </template>
              <div class="log-viewer">
                <template x-if="clusterLogs">
                  <pre x-text="clusterLogs"></pre>
                </template>
                <template x-if="!clusterLogs">
                  <p class="log-placeholder">选择上方 Pod 的"日志"按钮查看日志...</p>
                </template>
              </div>
            </div>

            <!-- Service 连通性测试 -->
            <div class="cluster-section">
              <h4>🔌 Service 连通性测试</h4>
              <div class="connectivity-test">
                <div class="connectivity-inputs">
                  <input type="text" class="connectivity-service-input" x-model="connectivityService" placeholder="Service 名称" />
                  <input type="number" class="connectivity-port-input" x-model.number="connectivityPort" placeholder="端口" min="1" max="65535" />
                  <button class="btn-test-connectivity" @click="testConnectivity()">🔍 测试</button>
                </div>
                <template x-if="connectivityResult">
                  <div class="connectivity-result" :class="{'result-ok': connectivityResult.reachable, 'result-fail': !connectivityResult.reachable}">
                    <span x-text="connectivityResult.reachable ? '✅ 可达' : '❌ 不可达'"></span>
                    <template x-if="connectivityResult.error">
                      <span class="connectivity-error" x-text="connectivityResult.error"></span>
                    </template>
                    <template x-if="connectivityResult.response">
                      <pre class="connectivity-response" x-text="connectivityResult.response"></pre>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </article>
      </template>

      <!-- 未选择关卡时的占位 -->
      <template x-if="!currentLevel">
        <div class="no-level-selected">
          <div class="placeholder-icon">🚀</div>
          <p>选择左侧关卡开始你的 K8s 学习之旅！</p>
          <p class="placeholder-sub">从 Q0.1 架构总览开始，一步步掌握 K8s 实战技能 📚</p>
        </div>
      </template>
    </section>

    <!-- ========== 右栏: 成就面板 ========== -->
    <aside class="sidebar-right">
      <h3 class="sidebar-title">🏆 成就面板</h3>

      <!-- 徽章展示区 -->
      <div class="badges-section">
        <div class="badges-grid">
          <template x-for="badge in allBadges" :key="badge.id">
            <div class="badge-item"
                 :class="{ unlocked: isBadgeUnlocked(badge.id), locked: !isBadgeUnlocked(badge.id), 'badge-pop': badgePopAnim === badge.id }"
                 :title="badge.desc">
              <span class="badge-icon" x-text="isBadgeUnlocked(badge.id) ? badge.icon : '🔒'"></span>
              <span class="badge-name" x-text="badge.name"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- 统计数据 -->
      <div class="stats-section">
        <h4>📊 统计</h4>
        <div class="stat-row">
          <span class="stat-label">通关数</span>
          <span class="stat-value" x-text="progress.completed_levels.length + '/24'"></span>
        </div>
        <div class="stat-row">
          <span class="stat-label">总尝试</span>
          <span class="stat-value" x-text="totalAttempts"></span>
        </div>
        <div class="stat-row">
          <span class="stat-label">最高连击</span>
          <span class="stat-value" x-text="'x' + progress.max_streak"></span>
        </div>
        <div class="stat-row">
          <span class="stat-label">徽章数</span>
          <span class="stat-value" x-text="progress.badges.length + '/' + allBadges.length"></span>
        </div>
        <div class="stat-row">
          <span class="stat-label">总用时</span>
          <span class="stat-value" x-text="formatTime(totalTimeSpent)"></span>
        </div>
      </div>

      <!-- 结业报告按钮 -->
      <button class="btn-report" @click="showReport()">📊 查看结业报告</button>

      <!-- 进度导入导出按钮 -->
      <div class="progress-io-buttons">
        <button class="btn-export-progress" @click="exportProgress()">📤 导出进度</button>
        <button class="btn-import-progress" @click="$refs.importFileInput.click()">📥 导入进度</button>
        <input type="file" x-ref="importFileInput" accept=".json" style="display:none" @change="importProgress($event)" />
      </div>
    </aside>
  </main>

  <!-- ==================== 浮动提示 ==================== -->
  <template x-if="toast.show">
    <div class="toast" :class="'toast-' + toast.type" x-transition>
      <span x-text="toast.message"></span>
    </div>
  </template>

  <!-- ==================== +XP 浮动动画 ==================== -->
  <template x-if="xpFloat.show">
    <div class="xp-float" :class="{ 'xp-float-show': xpFloat.show }"
         :style="`left: ${xpFloat.x}px; top: ${xpFloat.y}px`">
      <span x-text="xpFloat.text"></span>
    </div>
  </template>

  <!-- ==================== 结业报告 Modal ==================== -->
  <template x-if="reportModal.show">
    <div class="modal-overlay" @click.self="reportModal.show = false">
      <div class="modal-content">
        <!-- 关闭按钮 -->
        <button class="modal-close" @click="reportModal.show = false">✕</button>

        <template x-if="reportModal.loading">
          <div class="report-loading">
            <div class="loading-spinner"></div>
            <p>🍒 樱桃正在生成报告...</p>
          </div>
        </template>

        <template x-if="!reportModal.loading && reportData">
          <div class="report-body">
            <h2 class="report-title">🍒 K8s Quest 结业报告</h2>

            <!-- 成绩评定 -->
            <div class="report-grade-section">
              <div class="report-grade" :class="'grade-' + reportData.grade" x-text="reportData.grade"></div>
              <div class="grade-comment" x-text="reportData.grade_comment"></div>
            </div>

            <!-- 完成率圆环 -->
            <div class="report-completion">
              <svg class="completion-ring" width="120" height="120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#2a3142" stroke-width="8"></circle>
                <circle cx="60" cy="60" r="52" fill="none" stroke="#ff6b9d" stroke-width="8"
                        stroke-linecap="round"
                        :stroke-dasharray="326.7"
                        :stroke-dashoffset="326.7 * (1 - reportData.completion_rate)"
                        transform="rotate(-90 60 60)"></circle>
              </svg>
              <div class="completion-text">
                <span class="completion-number" x-text="reportData.completed_count + '/' + reportData.total_levels"></span>
                <span class="completion-label">关卡完成</span>
              </div>
            </div>

            <!-- 当前称号 -->
            <div class="report-rank">
              <span class="rank-current" x-text="'当前称号: ' + reportData.rank"></span>
              <template x-if="reportData.next_rank">
                <span class="rank-next" x-text="'距离 ' + reportData.next_rank + ' 还需 ' + reportData.xp_to_next_rank + ' XP'"></span>
              </template>
              <template x-if="!reportData.next_rank">
                <span class="rank-max">👑 已达成最高称号！</span>
              </template>
            </div>

            <!-- 知识域掌握度 -->
            <div class="report-section">
              <h3>📚 知识域掌握度</h3>
              <template x-for="(stats, domain) in reportData.domain_stats" :key="domain">
                <div class="domain-bar-row">
                  <div class="domain-bar-label">
                    <span x-text="domain"></span>
                    <span x-text="stats.completed + '/' + stats.total"></span>
                  </div>
                  <div class="domain-bar-track">
                    <div class="domain-bar-fill" :style="`width: ${stats.rate * 100}%`"></div>
                  </div>
                </div>
              </template>
            </div>

            <!-- 章节完成情况 -->
            <div class="report-section">
              <h3>📖 章节完成情况</h3>
              <div class="chapter-stats-grid">
                <template x-for="(stats, chId) in reportData.chapter_stats" :key="chId">
                  <div class="chapter-stat-item" :style="`border-color: ${chapters[chId]?.color || '#555'}`">
                    <span class="ch-stat-icon" x-text="stats.icon"></span>
                    <span class="ch-stat-title" x-text="stats.title"></span>
                    <span class="ch-stat-count" x-text="stats.completed + '/' + stats.total"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- 薄弱项 -->
            <div class="report-section" x-show="reportData.weak_areas.length > 0">
              <h3>⚠️ 薄弱项</h3>
              <div class="weak-areas-list">
                <template x-for="wa in reportData.weak_areas" :key="wa.level_id">
                  <div class="weak-area-item">
                    <span class="weak-area-id" x-text="wa.level_id"></span>
                    <span class="weak-area-reason" x-text="wa.reason"></span>
                    <span class="weak-area-kp" x-text="wa.knowledge_points.join(', ')"></span>
                  </div>
                </template>
              </div>
            </div>

            <!-- 优势项 -->
            <div class="report-section" x-show="reportData.strengths.length > 0">
              <h3>⭐ 优势项 (一次通过)</h3>
              <div class="strengths-list">
                <template x-for="s in reportData.strengths" :key="s.level_id">
                  <span class="strength-item" x-text="s.level_id"></span>
                </template>
              </div>
            </div>

            <!-- 学习建议 -->
            <div class="report-section" x-show="reportData.recommendations.length > 0">
              <h3>💡 学习建议</h3>
              <ul class="recommendations-list">
                <template x-for="rec in reportData.recommendations" :key="rec">
                  <li x-text="rec"></li>
                </template>
              </ul>
            </div>

            <!-- 操作按钮 -->
            <div class="report-actions">
              <button class="btn-export" @click="exportReport()">📥 导出报告</button>
              <button class="btn-export-mentor" @click="exportMentorReport()">📤 导出给导师</button>
              <button class="btn-reset-progress" @click="confirmReset()">🔄 重置进度</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ==================== 重置确认 Modal ==================== -->
  <template x-if="resetConfirm.show">
    <div class="modal-overlay" @click.self="resetConfirm.show = false">
      <div class="modal-content modal-small">
        <h3>⚠️ 确认重置进度？</h3>
        <p>这将清空你所有的通关记录、XP、徽章和连击记录。此操作不可撤销！</p>
        <div class="reset-confirm-actions">
          <button class="btn-cancel" @click="resetConfirm.show = false">取消</button>
          <button class="btn-confirm-reset" @click="doReset()">确认重置</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ==================== 页脚 ==================== -->
  <footer class="footer">
    <p>Made by 🍒 樱桃 (Hermes Agent) · K8s Quest v0.3.0</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
